version: "3.4"
services:
  redis:
    image: redis
    volumes:
      - ./data/redis:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
  web:
    build: .
    image: pi-air-quality-monitor
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    environment:
        - REDIS_HOST=redis
        - PORT=8000
    volumes:
      - ./src:/code
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - "redis"
    ports:
      - "8000:8000"
